      [field]: prev[field].includes(value)
        ? prev[field].filter(v => v !== value)

// Main App
// ═══════════════════════════════════════════════════════════════════════════

function App() {
  const [showOnboarding, setShowOnboarding] = useState(false);
  const [activeSection, setActiveSection] = useState('');

  const handleNavigate = (section) => {
    if (section === 'onboarding') {
      setShowOnboarding(true);
    } else {
      const el = document.getElementById(section);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  };

  useEffect(() => {
    const handleScroll = () => {
      const sections = ['services', 'methodology', 'why-us', 'contact'];
      const current = sections.find(id => {
        const el = document.getElementById(id);
        if (el) {
          const rect = el.getBoundingClientRect();
          return rect.top <= 100 && rect.bottom >= 100;
        }
        return false;
      });
      setActiveSection(current || '');
    };

    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  return h('div', { className: 'min-h-screen' },
    h(Nav, { onNavigate: handleNavigate, activeSection }),
    h(Hero, { onNavigate: handleNavigate }),
    h(Services),
    h(Methodology),
    h(WhyUs),
    h(Contact, { onNavigate: handleNavigate }),
    h(Footer),
    showOnboarding && h(OnboardingForm, { onClose: () => setShowOnboarding(false) }),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
