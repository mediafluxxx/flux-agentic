function SourcesPage() {
  const categories = [
    { name: 'Harness Architecture', sources: SOURCES.harness },
    { name: 'Model Context Protocol (MCP)', sources: SOURCES.mcp },

  return h(Section, null,

// ─── App ─────────────────────────────────────────────────────────────────────

const PAGE_MAP = {
  overview: OverviewPage,
  philosophy: PhilosophyPage,
  harness: HarnessPage,
  memory: MemoryPage,
  disciplines: DisciplinesPage,
  alignment: AlignmentPage,
  roadmap: RoadmapPage,
  sources: SourcesPage,
};

function App() {
  const [page, setPage] = useState(() => {
    const hash = window.location.hash.slice(1);
    return PAGE_MAP[hash] ? hash : 'overview';
  });

  const navigate = useCallback((id) => {
    setPage(id);
    window.location.hash = id;
    window.scrollTo(0, 0);
  }, []);

  useEffect(() => {
    const handler = () => {
      const hash = window.location.hash.slice(1);
      if (PAGE_MAP[hash]) setPage(hash);
    };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const PageComponent = PAGE_MAP[page];

  return h('div', { className: 'min-h-screen' },
    h(Nav, { active: page, onNav: navigate }),
    h('main', { className: 'max-w-5xl mx-auto px-4 sm:px-6 pt-20 pb-16' },
      h(PageComponent, { onNav: navigate }),
    ),
    h('footer', { className: 'border-t border-slate-800/60 mt-8' },
      h('div', { className: 'max-w-5xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3' },
        h('div', { className: 'text-xs text-slate-600' }, 'FLUX AGENTIC — Penta-Alignment Framework v3.0'),
        h('div', { className: 'text-xs text-slate-600' }, '18 claims verified • 38 sources • 3 analyses synthesized • March 2026'),
      ),
    ),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
